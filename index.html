, {"State": "Yap", "Facility": "Falalis Dispensary", "Location": "Falalis", "Tank / Storage": "Catchment", "Capacity (gal)": "Not stated", "Condition": "Needs maintenance", "Details": "Needs raising; new PVC pipes needed"}, {"State": "Yap", "Facility": "Mogmog Dispensary", "Location": "Mogmog", "Tank / Storage": "Catchment", "Capacity (gal)": "Not stated", "Condition": "Not working", "Details": "Needs cleaning; no working pump or piping"}, {"State": "Yap", "Facility": "Elato Dispensary", "Location": "Elato", "Tank / Storage": "Catchment", "Capacity (gal)": "Not stated", "Condition": "Not working", "Details": "Not connected; no pump, piping or fixtures"}, {"State": "Yap", "Facility": "Fachailap Dispensary", "Location": "Fachailap", "Tank / Storage": "Catchment", "Capacity (gal)": "Not stated", "Condition": "Not installed", "Details": "On site but not installed"}, {"State": "Yap", "Facility": "Satawal Dispensary", "Location": "Satawal", "Tank / Storage": "Catchment", "Capacity (gal)": "Not stated", "Condition": "Not installed", "Details": "Needs installation; plumbing incomplete"}, {"State": "Yap", "Facility": "Asor Dispensary", "Location": "Asor", "Tank / Storage": "Catchment", "Capacity (gal)": "Not stated", "Condition": "Not working", "Details": "Obsolete; no pump, piping or fixtures"}, {"State": "Yap", "Facility": "Seliap Dispensary", "Location": "Seliap, Woleai", "Tank / Storage": "Catchment (none working)", "Capacity (gal)": "Not stated", "Condition": "Not working", "Details": "Entire water and sanitation system must be rebuilt"}], "other": [{"State": "Chuuk", "Facility": "Fanip Dispensary", "Location": "Fefen", "Status": "Tank destroyed", "Notes": "Original tank destroyed during construction of a nearby school; no water supply"}, {"State": "Chuuk", "Facility": "Romanum Dispensary", "Location": "Namunsefo Faichuk", "Status": "Unclear", "Notes": "Water supply described only as 'supported by IOM'"}, {"State": "Pohnpei", "Facility": "Nukuoro Dispensary", "Location" const STATES = ["Chuuk","Kosrae","Pohnpei","Yap"];
const CONDS = ["Good","Working","Fair","Partial","Needs maintenance","Inadequate","Not working","Not installed","Not stated"];
const GROUP = {"Good":"good","Working":"good","Fair":"warn","Partial":"warn","Needs maintenance":"warn","Inadequate":"bad","Not working":"bad","Not installed":"bad","Not stated":"unk"};
const GROUPS = [["good","Functional"],["warn","Needs attention"],["bad","Not working / inadequate"],["unk","Not stated"]];
const PAGES = [["summary","Summary"],...STATES.map(s=>[s.toLowerCase(),s]),["other","Sites not counted"]];
let TANKS=[], OTHER=[], usedFallback=false, filterText="";

function parseCSV(text){
  text=text.replace(/^﻿/,"");
  const rows=[]; let row=[], f="", q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if(c==='"') q=true;
    else if(c===','){ row.push(f); f=""; }
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(f); rows.push(row); row=[]; f=""; }
    else f+=c;
  }
  if(f!==""||row.length){ row.push(f); rows.push(row); }
  const head=rows.shift().map(h=>h.trim());
  return rows.filter(r=>r.some(v=>v.trim()!=="")).map(r=>Object.fromEntries(head.map((h,i)=>[h,(r[i]||"").trim()])));
}
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const grp=c=>GROUP[c]||"unk";
const canonState=s=>STATES.find(x=>x.toLowerCase()===String(s).toLowerCase())||s;

async function load(){
  let lastMod=null;
  try{
    const [a,b]=await Promise.all(["data/water_tanks.csv","data/other_sites.csv"].map(u=>fetch(u,{cache:"no-cache"})));
    if(!a.ok||!b.ok) throw new Error("missing");
    TANKS=parseCSV(await a.text()); OTHER=parseCSV(await b.text());
    lastMod=a.headers.get("last-modified");
  }catch(e){ TANKS=FALLBACK.tanks; OTHER=FALLBACK.other; usedFallback=true; }
  TANKS.forEach(r=>{ r.State=canonState(r.State); if(!CONDS.includes(r.Condition)) r.Condition=r.Condition||"Not stated"; });
  OTHER.forEach(r=>r.State=canonState(r.State));
  document.getElementById("updated").textContent = usedFallback
    ? "Showing the data built into this page (data files not found)."
    : (lastMod ? "Data file last updated "+new Date(lastMod).toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"}) : "");
  route();
}

  const c=k=>rows.filter(r=>grp(r.Condition)===k).length;
  let h=`<section class="kpis" aria-label="Totals">

    <div class="kpi warn"><span class="n">${c("warn")}</span><span class="l">Needs attention</span></div>
    <div class="kpi bad"><span class="n">${c("bad")}</span><span class="l">Not working / inadequate</span></div>
    <div class="kpi unk"><span class="n">${c("unk")}</span><span class="l">Condition not stated</span></div>`;
  if(extra!=null) h+=`<div class="kpi"><span class="n">${extra}</span><span class="l">Sites not counted</span></div>`;
  return h+`</section>`;
}
const legend=()=>`<div class="legend">${GROUPS.map(([k,l])=>`<span><i class="sw ${k}"></i>${l}</span>`).join("")}</div>`;
const pill=c=>`<span class="pill ${grp(c)}">${esc(c)}</span>`;

function stateBars(){
  const max=Math.max(1,...STATES.map(s=>TANKS.filter(r=>r.State===s).length));
  return `<div class="bars">${STATES.map(s=>{
    const rows=TANKS.filter(r=>r.State===s);
    const segs=GROUPS.map(([k,l])=>{const n=rows.filter(r=>grp(r.Condition)===k).length;
      return n?`<div class="seg ${k}" style="width:${n/max*100}%" title="${l}: ${n}">${n}</div>`:"";}).join("");
    return `<div class="brow"><a class="k" href="#${s.toLowerCase()}" style="color:inherit">${s}</a><div class="track">${segs}</div><span class="v">${rows.length}</span></div>`;
  }).join("")}</div>`;
}
function condBars(rows){
  const present=CONDS.filter(c=>rows.some(r=>r.Condition===c));
  const max=Math.max(1,...present.map(c=>rows.filter(r=>r.Condition===c).length));
  if(!present.length) return `<p class="empty">No facilities with tanks recorded.</p>`;
  return `<div class="bars">${present.map(c=>{const n=rows.filter(r=>r.Condition===c).length;
    return `<div class="crow"><span>${esc(c)}</span><div class="track" style="height:14px"><div class="fill seg ${grp(c)}" style="width:${n/max*100}%"></div></div><span class="v num" style="font-family:var(--mono)">${n}</span></div>`}).join("")}</div>`;
}
function matrix(){
  const cell=n=>n?n:`<span class="zero">0</span>`;
  const rows=CONDS.map(c=>{const ns=STATES.map(s=>TANKS.filter(r=>r.State===s&&r.Condition===c).length);
    return `<tr><td>${pill(c)}</td>${ns.map(n=>`<td>${cell(n)}</td>`).join("")}<td>${cell(ns.reduce((a,b)=>a+b,0))}</td></tr>`}).join("");
  const tot=STATES.map(s=>TANKS.filter(r=>r.State===s).length);
  return `<div class="scroll"><table class="matrix"><thead><tr><th>Condition</th>${STATES.map(s=>`<th>${s}</th>`).join("")}<th>Total</th></tr></thead>
    <tbody>${rows}<tr class="tot"><td>Total</td>${tot.map(n=>`<td>${n}</td>`).join("")}<td>${TANKS.length}</td></tr></tbody></table></div>`;
}
function tankTable(rows){
  if(!rows.length) return `<p class="empty">No facilities match.</p>`;
  return `<div class="scroll"><table><thead><tr><th>Facility</th><th>Location</th><th>Tank / storage</th><th class="num">Capacity (gal)</th><th>Condition</th><th>Details</th></tr></thead><tbody>
    ${rows.map(r=>`<tr><td class="fac">${esc(r.Facility)}</td><td>${esc(r.Location)}</td><td>${esc(r["Tank / Storage"])}</td><td class="num">${esc(r["Capacity (gal)"])}</td><td>${pill(r.Condition)}</td><td class="det">${esc(r.Details)}</td></tr>`).join("")}
  </tbody></table></div>`;
}
function otherTable(rows,withState){
  if(!rows.length) return `<p class="empty">None for this state.</p>`;
  return `<div class="scroll"><table><thead><tr>${withState?"<th>State</th>":""}<th>Facility</th><th>Location</th><th>Status</th><th>Notes</th></tr></thead><tbody>
    ${rows.map(r=>`<tr>${withState?`<td>${esc(r.State)}</td>`:""}<td class="fac">${esc(r.Facility)}</td><td>${esc(r.Location)}</td><td><span class="pill unk">${esc(r.Status)}</span></td><td class="det">${esc(r.Notes)}</td></tr>`).join("")}
  </tbody></table></div>`;
}

function render(page){
  const v=document.getElementById("view"); let h="";
  if(usedFallback) h+=`<p class="note">The data files weren't found, so this page is showing its built-in copy of the data.</p>`;
  if(page==="summary"){
    h+=kpis(TANKS,OTHER.length)+`<div class="grid2">
      <section class="panel"><h2>Tank status by state</h2>${legend()}${stateBars()}</section>
      <section class="panel"><h2>Facilities by condition and state</h2>${matrix()}</section></div>`;
  }else if(page==="other"){
    h+=`<section class="panel"><h2>Sites not counted</h2><p class="sub" style="margin-bottom:10px">No tank, tank status unclear, or water not covered in the report.</p>${otherTable(OTHER,true)}</section>`;
  }else{
    const s=STATES.find(x=>x.toLowerCase()===page);
    const rows=TANKS.filter(r=>r.State===s);
    const shown=rows.filter(r=>!filterText||Object.values(r).join(" ").toLowerCase().includes(filterText));
    h+=kpis(rows,OTHER.filter(r=>r.State===s).length)+`<div class="grid2">
      <section class="panel"><h2>Facilities by condition</h2>${condBars(rows)}</section>
      <section class="panel"><h2>${s} sites not counted</h2>${otherTable(OTHER.filter(r=>r.State===s),false)}</section></div>
      <section class="panel"><div class="tools"><h2>${s} facilities with tanks</h2>
        <input type="search" id="q" placeholder="Search facility, island, condition…" aria-label="Search facilities" value="${esc(filterText)}"></div>
        <div id="tbl">${tankTable(shown)}</div></section>`;
  }
  v.innerHTML=h;
  const q=document.getElementById("q");
  if(q) q.addEventListener("input",e=>{filterText=e.target.value.trim().toLowerCase();
    const s=STATES.find(x=>x.toLowerCase()===page);
    document.getElementById("tbl").innerHTML=tankTable(TANKS.filter(r=>r.State===s&&(!filterText||Object.values(r).join(" ").toLowerCase().includes(filterText))));});
}
function route(){
  const page=(location.hash||"#summary").slice(1);
  const valid=PAGES.some(p=>p[0]===page)?page:"summary";
  document.getElementById("tabs").innerHTML=PAGES.map(([k,l])=>`<a href="#${k}"${k===valid?' aria-current="page"':""}>${l}</a>`).join("");
  filterText=""; render(valid); window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);
load();
</script>

</body>
</html>
